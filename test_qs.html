<!DOCTYPE html>
<html>
<body>
<div class="video-item" data-id="ab\c"></div>
<script>
try {
    const id = "ab\\c";
    const cleanId = String(id).replace(/"/g, '\\"');
    const qs = `.video-item[data-id="${cleanId}"]`;
    console.log("QS:", qs);
    const el = document.querySelector(qs);
    console.log("Found:", !!el);
} catch (e) {
    console.log("ERROR:", e.name, e.message);
}
try {
    const id2 = "abc\\";
    const cleanId2 = String(id2).replace(/"/g, '\\"');
    const qs2 = `.video-item[data-id="${cleanId2}"]`;
    console.log("QS2:", qs2);
    const el2 = document.querySelector(qs2);
    console.log("Found2:", !!el2);
} catch (e) {
    console.log("ERROR2:", e.name, e.message);
}
</script>
</body>
</html>
