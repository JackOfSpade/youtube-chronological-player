name: CI

# The suite covers API-safety regressions as well as the import/compile smoke
# checks. It needs no configured YouTube API key because route tests replace
# external calls with fakes.
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke-test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run regression tests
        run: python -m pytest -q

      - name: Byte-compile all Python sources (catches syntax errors)
        run: python -m compileall -q .

      # Smoke test: catches broken imports, renamed symbols, and other
      # wiring failures across app.py and the service modules it imports.
      - name: Import the Flask app
        run: python -c "import app; print(app.app)"

  browser:
    name: Browser playback regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-browser.txt
      - run: python -m pip install -r requirements-browser.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements-browser.txt') }}
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser/check_playback.py

  required:
    name: CI required
    if: ${{ always() }}
    needs: ["build-and-smoke-test", "browser", "merge-policy"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every prerequisite to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ["JOB_RESULTS"])
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if failed:
              sys.exit("Unsuccessful prerequisites: " + ", ".join(failed))
          PY
  merge-policy:
    name: Validate merge policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 -m unittest discover -s .github/tests -p 'test_merge_validated_pr.py'
