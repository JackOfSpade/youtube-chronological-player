name: CI

# NOTE: This repo has no test suite yet (no tests/, no pytest/unittest in
# requirements.txt, no pyproject.toml/pytest.ini anywhere). Until real tests
# exist, this workflow runs the most meaningful build/import check available:
# install the pinned dependencies, byte-compile every .py file (catches
# syntax errors), and import the Flask app object itself (catches broken
# imports, renamed symbols, decorator typos, etc. across app.py and the
# service modules it wires together). This is a genuine smoke check, not a
# no-op — it fails on real breakage even without config.yaml or API keys,
# since app.run() is guarded behind `if __name__ == "__main__":` and every
# module with import-time side effects wraps risky work in try/except.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke-test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Byte-compile all Python sources (catches syntax errors)
        run: python -m compileall -q .

      # Smoke test: catches broken imports, renamed symbols, and other
      # wiring failures across app.py and the service modules it imports.
      - name: Import the Flask app
        run: python -c "import app; print(app.app)"
